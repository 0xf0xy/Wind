[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wind"
version = "2.0.0"
description = "Pattern-based wordlist generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "0xf0xy" }
]
dependencies = []

[project.scripts]
wind = "wind.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wind*"]

[tool.setuptools.package-data]
"wind.data" = ["patterns.json"]